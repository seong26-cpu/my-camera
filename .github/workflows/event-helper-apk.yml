name: event-helper APK

on:
  push:
    paths:
      - "event-helper/**"
      - ".github/workflows/event-helper-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: event-helper/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp event-helper/android/app/build/outputs/apk/debug/app-debug.apk event-helper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: event-helper-apk
          path: event-helper.apk

      - name: Publish to Release (event-helper-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: event-helper-latest
          name: 응모 도우미 (최신 APK)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: event-helper.apk
          body: |
            폰에서 아래 event-helper.apk 를 눌러 내려받고 설치하세요.
            빌드 커밋: ${{ github.sha }}

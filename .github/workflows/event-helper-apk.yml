name: event-helper APK

on:
  push:
    paths:
      - "event-helper/**"
      - ".github/workflows/event-helper-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: 엔진·메일 중계 시험 (자동 제출 0회 등)
        run: |
          cd event-helper/test
          npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node mailer.test.js
          node engine.test.js
          node ui.test.js

      - name: 비공개 서명 키 준비 (Secrets 에 있을 때만)
        env:
          KS: ${{ secrets.EH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/eh.jks"
            echo "EH_KEYSTORE=$RUNNER_TEMP/eh.jks" >> "$GITHUB_ENV"
            echo "비공개 키로 서명합니다"
          else
            echo "Secrets 없음 → 저장소의 고정 디버그 키로 서명합니다"
          fi

      - name: Build APK
        working-directory: event-helper/android
        env:
          EH_KEYSTORE_PASSWORD: ${{ secrets.EH_KEYSTORE_PASSWORD }}
          EH_KEY_ALIAS: ${{ secrets.EH_KEY_ALIAS }}
          EH_KEY_PASSWORD: ${{ secrets.EH_KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp event-helper/android/app/build/outputs/apk/debug/app-debug.apk event-helper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: event-helper-apk
          path: event-helper.apk

      - name: Publish to Release (event-helper-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: event-helper-latest
          name: 응모 도우미 (최신 APK)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: event-helper.apk
          body: |
            폰에서 아래 event-helper.apk 를 눌러 내려받고 설치하세요.
            빌드 커밋: ${{ github.sha }}
